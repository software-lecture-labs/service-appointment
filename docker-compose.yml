services:
  postgres:
    image: postgres:17-alpine
    container_name: service-appointment-db
    environment:
      POSTGRES_DB: ${DB_NAME:-service_appointment}
      POSTGRES_USER: ${DB_USERNAME:-servis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-servis}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
